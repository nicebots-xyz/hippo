name: Licenses

# Every source file carries the project's SPDX license header (licensor-config.yaml).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-headers:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: nicebots-xyz/licensor/.github/actions/setup-licensor@a5893a8a480981ea21cb25cedcb0302616e8b859 # v0.1.2

      - name: Check license headers
        run: licensor check --ignore ".*" -- *
